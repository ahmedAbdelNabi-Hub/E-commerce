<div class="relative carousel-1container">
  <ng-container *ngIf="!isLoadingSignal(); else skeletonLoader">
    <owl-carousel-o [options]="customOptions" *ngIf="productsSignal()">
      <ng-container *ngFor="let product of productsSignal()?.data; trackBy: trackByFn">
        <ng-template carouselSlide [id]="product.name">
          <app-product-card-with-discound [gift]="gift" class="card" [Recently]="Recently"
            [productData]="product"></app-product-card-with-discound>
        </ng-template>
      </ng-container>
    </owl-carousel-o>
  </ng-container>

  <ng-template #skeletonLoader>
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
      <div class="animate-pulse" *ngFor="let item of [1,2,3,4,5]">
        <!-- Product image skeleton -->
        <div class="bg-gray-200 dark:bg-gray-700 rounded-lg h-48 mb-4 transition-colors duration-200"></div>
        
        <!-- Product details skeleton -->
        <div class="space-y-3">
          <!-- Product title skeleton -->
          <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded w-[85%] transition-colors duration-200"></div>
          
          <!-- Product price skeleton -->
          <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded w-[60%] transition-colors duration-200"></div>
          
          <!-- Product description skeleton -->
          <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded w-[75%] transition-colors duration-200"></div>
        </div>
      </div>
    </div>
  </ng-template>
</div>
