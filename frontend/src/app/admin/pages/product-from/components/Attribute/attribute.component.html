<div class="container mx-auto mt-3 ">
    <div class="bg-white  p-4">
        <!-- Header -->
        <div class="flex flex-col sm:flex-row items-center justify-between gap-3 mb-6">
            <div>
                <h2 class="text-lg font-medium ">Add Product Attributes</h2>
                <p class="text-sm text-gray-500">Define attributes and values</p>
            </div>
            <div class="flex gap-2">
                <button (click)="addAttribute()" type="button"
                    class="bg-[#eee]  text-black px-3 py-1.5 rounded text-sm">
                    Add Attribute
                </button>

            </div>
        </div>

        <!-- Messages -->
        <ng-container *ngIf="error || successMessage">
            <div *ngIf="error" class="mb-3 p-2 bg-red-50 border-l-4 border-red-400 text-sm flex items-center">
                <svg class="w-4 h-4 text-red-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <p class="text-red-600">{{ error }}</p>
                <button *ngIf="attributes.length === 0" (click)="retryLoad()"
                    class="ml-2 text-red-500 hover:text-red-600">Retry</button>
            </div>

            <div *ngIf="successMessage"
                class="mb-3 p-2 bg-green-50 border-l-4 border-green-400 text-sm flex items-center">
                <svg class="w-4 h-4 text-green-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <p class="text-green-600">{{ successMessage }}</p>
            </div>
        </ng-container>

        <!-- Attributes Form -->
        <div>
            <!-- Empty State -->
            <div *ngIf="selectedAttributes.length === 0"
                class="text-center py-8 bg-gray-50 rounded-lg border-2 border-dashed border-gray-300">
                <svg class="w-16 h-16 mx-auto mb-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <h3 class="font-semibold text-lg text-gray-900 mb-1">No Attributes Added</h3>
                <p class="text-sm text-gray-600">Get started by clicking the "Add Attribute" button above</p>
            </div>

            <!-- Dynamic Attribute Rows -->
            <div *ngFor="let attr of selectedAttributes; let i = index" class="mb-3 p-3 bg-gray-50 rounded">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label class="text-xs font-medium  mb-1 block">Attribute</label>
                        <select [ngModel]="attr.attributeId" (ngModelChange)="onAttributeChange(i, $event)"
                            class="w-full px-2 py-1.5 text-sm border border-blue-200 rounded focus:ring-1 focus:ring-blue-500">
                            <option [ngValue]="0">Select</option>
                            <option *ngFor="let option of getAvailableAttributes(i)" [ngValue]="option.id">{{
                                option.name }}</option>
                        </select>
                    </div>

                    <div>
                        <label class="text-xs font-medium  mb-1 block">Value</label>
                        <select [ngModel]="attr.attributeValueId" (ngModelChange)="onValueChange(i, $event)"
                            [disabled]="!attr.attributeId"
                            class="w-full px-2 py-1.5 text-sm border border-blue-200 rounded focus:ring-1 focus:ring-blue-500 disabled:bg-gray-50">
                            <option [ngValue]="0">Select</option>
                            <option *ngFor="let value of getValuesForAttribute(attr.attributeId)" [ngValue]="value.id">
                                {{ value.value }}</option>
                        </select>
                    </div>

                    <div class="flex justify-end">
                        <button (click)="removeAttribute(i)" type="button" class="bg-[#eee]  text-black px-2 py-1 w-8 h-8 rounded-md">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Summary Table -->
            <div *ngIf="selectedAttributes.length > 0" class="mt-6">
                <div class="bg-white rounded border border-blue-100 overflow-hidden">
                    <div class="p-3 bg-gray-50 border-b border-blue-100">
                        <h3 class="text-sm font-medium text-blue-700 flex items-center">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2V7a2 2 0 00-2-2h-2" />
                            </svg>
                            Summary
                        </h3>
                    </div>
                    <table class="w-full text-sm">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-3 py-2 text-left text-xs font-medium text-blue-600">Status</th>
                                <th class="px-3 py-2 text-left text-xs font-medium text-blue-600">Attribute</th>
                                <th class="px-3 py-2 text-left text-xs font-medium text-blue-600">Value</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let a of selectedAttributes" class="border-t border-blue-100">
                                <td class="px-3 py-2">
                                    <svg *ngIf="a.attributeName && a.valueName" class="w-4 h-4 text-green-500"
                                        fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M9 12l2 2 4-4" />
                                    </svg>
                                    <svg *ngIf="!a.attributeName || !a.valueName" class="w-4 h-4 text-yellow-500"
                                        fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                    </svg>
                                </td>
                                <td class="px-3 py-2 text-blue-900">{{ a.attributeName || 'Not Selected' }}</td>
                                <td class="px-3 py-2 text-blue-900">{{ a.valueName || 'Not Selected' }}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
